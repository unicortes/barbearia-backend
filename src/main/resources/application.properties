spring.application.name=Barbearia Unicortes

# Server Port Configuration
server.port=8080
server.servlet.context-path=/barbeariaUnicortes

##Spring Datasource configuration
spring.datasource.url=jdbc:mysql://localhost:3306/barbearia
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# ADMIN Config
admin.email=admin@admin.com
admin.password=admin

# Home by Role
security.redirect.roles.ADMIN=/admin/home
security.redirect.roles.BARBER=/barbeiro/home
security.redirect.roles.CLIENT=/cliente/home

# Logout
app.security.logout.success-url=/barbeariaUnicortes/login
app.security.logout.add-timestamp-param=true

# Swagger/OpenAPI Config
springdoc.swagger-ui.path=/api-docs
springdoc.api-docs.path=/api-docs.json
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.operationsSorter=alpha
springdoc.show-actuator=true

# CORS Config
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Origin,Content-Type,Accept,Authorization,X-Requested-With
app.cors.exposed-headers=Authorization,Content-Disposition

jwt.secret=secreta

logging.level.root=DEBUG
logging.level.org.springframework=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
